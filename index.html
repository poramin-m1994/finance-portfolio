<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
    }
  </style>
</head>

<body class="flex items-center justify-center h-screen">

  <!-- Card -->
  <div class="bg-slate-800 p-8 rounded-xl shadow-xl w-full max-w-sm">
    
    <h2 class="text-2xl font-semibold text-center mb-6">เข้าสู่ระบบ</h2>

    <!-- Username -->
    <div class="mb-4">
      <label class="block mb-1 text-sm">ชื่อผู้ใช้</label>
      <input id="username" type="text" class="w-full p-3 rounded-lg bg-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Password -->
    <div class="mb-6">
      <label class="block mb-1 text-sm">รหัสผ่าน</label>
      <input id="password" type="password" class="w-full p-3 rounded-lg bg-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Login Button -->
    <button onclick="login()" 
      class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg text-white font-semibold transition">
      เข้าสู่ระบบ
    </button>

  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white text-black p-6 rounded-xl shadow-xl w-80 text-center">
      <p id="modalMessage" class="mb-4"></p>
      <button onclick="closeModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">ปิด</button>
    </div>
  </div>

<script>

  // ====== CONFIG: URL ของ Apps Script ======
  const API_URL = "https://script.google.com/macros/s/AKfycbyGo4vLEbJiDsiJ4b9d4njFjbJ-rVnaSGVT39VCjPBXiZyHz94mknnoJHkg15yjtLOi/exec";

  function showModal(msg) {
    document.getElementById("modalMessage").innerText = msg;
    document.getElementById("modal").classList.remove("hidden");
  }

  function closeModal() {
    document.getElementById("modal").classList.add("hidden");
  }

async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  const formData = new FormData();
  formData.append("username", username);
  formData.append("password", password);

  try {
    const res = await fetch(API_URL + "?action=login", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (data.success) {
      sessionStorage.setItem("username", username);
      window.location.href = "dashboard.html";
    } else {
      showModal(data.msg);
    }

  } catch (error) {
    showModal("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
  }
}

</script>

</body>
</html>
